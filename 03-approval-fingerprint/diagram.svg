<text x="44" y="281" font-size="16" font-weight="bold" fill="#1f2a2a">Before posting</text>
<text x="44" y="303" font-size="15" fill="#3b4a4a">fingerprint again</text>
<path d="M280 322 L280 346" stroke="#2f4f4f" stroke-width="1.5"/>
<path d="M274 340 L280 348 L286 340" fill="none" stroke="#2f4f4f" stroke-width="1.5"/>
